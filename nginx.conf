server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
        application/json image/svg+xml font/woff2;

    # --- Halaman HTML: selalu cek ulang ke server (supaya update langsung tampil) ---
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Root Indonesia (default, tanpa prefix) & /en/ (English)
    location = / {
        try_files /index.html =404;
    }
    location = /en/ {
        try_files /en/index.html =404;
    }

    # --- Asset statis (css/js/image/icons/fonts): cache lama, aman karena
    #     nama file tidak berubah tiap deploy (kalau butuh bust cache,
    #     ganti nama file / tambah query version) ---
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Only the contact endpoint is executable; PHP files are never served as source.
    location = /contact/contact-process.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    # --- Fallback untuk path lain (contoh: /favicon.ico dsb) ---
    location / {
        try_files $uri $uri/ =404;
    }

    # Halaman 404 kustom -- opsional. Kalau kamu bikin file
    # dist/404.html (id) sendiri, cukup uncomment baris di bawah ini.
    # error_page 404 /404.html;

    # Keamanan dasar
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
}
