# Versi standalone -- untuk testing lokal / kalau kamu TIDAK pakai
# nginx reverse proxy eksternal dan mau langsung expose port ke host.
#
# Pakai:
#   docker compose -f docker-compose.standalone.yml up -d --build
#
# Lalu akses http://localhost:8083 (Indonesia) atau
# http://localhost:8083/en/ (English)

services:
  sdk-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY}
        EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID}
        EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID}
        EMAILJS_RECIPIENT: ${EMAILJS_RECIPIENT}
    container_name: sdk-web
    restart: unless-stopped
    ports:
      - "8083:80"
